<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión | Ctrl Alt Del Motors</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      <header class="auth-header">
        <img src="logo.png" alt="Logo Ctrl Alt Del Motors">
        <h1>Ctrl + Alt + Del Motors</h1>
        <p>Sistema de Gestión de Citas</p>
      </header>

      <div class="auth-tabs">
        <button class="auth-tab active">Iniciar Sesión</button>
        <button class="auth-tab">Registrarse</button>
      </div>

      <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus credenciales para acceder al sistema</p>

        <form>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com">
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>

          <div class="auth-extra">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button class="auth-button" type="submit">Iniciar Sesión</button>
        </form>
      </div>

      <footer class="auth-footer">
        © 2025 Ctrl + Alt + Del Motors. Todos los derechos reservados.
      </footer>
    </div>
  </div>

</body>
</html>
