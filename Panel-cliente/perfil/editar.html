<section class="section perfil-card">

    <h2 class="perfil-title">Editar Mi Perfil</h2>

    <form action="#" method="POST" id="editar-perfil-form" class="perfil-form">

        <div class="perfil-grid">

            <label class="perfil-label">
                <span>Nombre</span>
                <input type="text" name="name" value="Juan Pérez">
            </label>

            <label class="perfil-label">
                <span>Correo Electrónico</span>
                <input type="email" value="cliente@example.com" disabled>
            </label>

            <label class="perfil-label">
                <span>Teléfono</span>
                <input type="text" name="phone" value="3221234567">
            </label>

            <label class="perfil-label">
                <span>Dirección</span>
                <input type="text" name="direccion" value="Av. México 123, Puerto Vallarta">
            </label>

            <label class="perfil-label">
                <span>RFC</span>
                <input type="text" name="rfc" value="XAXX010101000">
            </label>

            <label class="perfil-label">
                <span>Fecha de nacimiento</span>
                <input type="date" name="fecha_nacimiento" value="1995-04-12">
            </label>

        </div>

        <div class="perfil-footer">
            <button class="button primary" type="submit">Guardar Cambios</button>
        </div>

    </form>

</section>
