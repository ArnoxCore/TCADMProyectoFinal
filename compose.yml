version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-tallerdb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: axion2025
      MYSQL_DATABASE: tallerdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: axion2025
      TZ: America/Mexico_City
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./Data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - mysql-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-paxion2025"]
      timeout: 20s
      retries: 10
      interval: 10s

networks:
  mysql-network:
    driver: bridge